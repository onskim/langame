# UI strings table — GDD Part 5 §7: "Localization hygiene from day 1: even
# though MVP is German-only, keep all UI strings in a strings table."
#
# TWO KINDS OF TEXT LIVE HERE, and the distinction matters:
#
#   `chrome`     — the player's interface, in THEIR language (English at MVP).
#                  Translated wholesale when the game ships elsewhere.
#   `diegetic`   — text the world itself shows: shop signs, the inner monologue.
#                  German because the village is German. This is curriculum-
#                  adjacent, so it carries `draft: true` and goes through the
#                  same native-review gate as any line (Part 5 §4).
#
# Engine code may reference these by key. It may NEVER contain a German literal
# (Part 4 §2) — that boundary is the entire multi-language strategy.

config_id: ui_strings

# Which language the WORLD speaks — the language the player is here to learn.
# Every diegetic string below is keyed by it, so a Spanish edition is this one
# value plus an `es:` line per entry. Nothing diegetic may be BAKED INTO ART for
# exactly this reason: the shop references arrived with "Bäckerei" and "Café"
# painted on the signboards, which would have made those buildings German
# forever. The lettering is erased from the sprite (tools/blank_sign.py) and
# drawn at runtime from `signs` below.
world_language: de

chrome:
  hint_controls: "WASD move   E interact   TAB phone   Space talk   F5 shot"
  dialogue_continue: "E continue"
  draft_watermark: "DRAFT — unreviewed"
  phone_close: "TAB close"
  day_label: "Day"
  door_prompt: "E"

# App names are diegetic: the player learns to read their own phone.
apps:
  tasks: Aufgaben
  words: Wörter
  weather: Wetter
  map: Karte

# What is painted on each building's signboard, and what its door announces —
# ONE record per building, so the sign and the prompt can never disagree.
signs:
  farmhouse:
    de: "Zuhause"
    en: "Home"
    draft: true
  bakery:
    de: "Bäckerei"
    en: "Bakery"
    draft: true
  cafe:
    de: "Café"
    en: "Café"
    draft: true
  shop:
    de: "Laden"
    en: "Shop"
    draft: true
  rathaus:
    de: "Rathaus"
    en: "Town hall"
    draft: true
  mila_house:
    de: "Milas Haus"
    en: "Mila's house"
    draft: true
  anna_kitchen:
    de: "Annas Küche"
    en: "Anna's kitchen"
    draft: true
  # What an interior's own door says on the way back out.
  exit:
    de: "raus"
    en: "out"
    draft: true

diegetic:
  door_locked:
    de: "Es ist zu."
    en: "It's closed."
    draft: true
  interior_dark:
    de: "Es ist dunkel…"
    en: "It's dark in here…"
    draft: true
  # The farm explains itself in German rather than falling silent. A refusal
  # that says nothing reads as a bug; a refusal that says "die Kuh hat Hunger"
  # is one more meeting with the word (Part 3 §2 — teach, never punish).
  animal_hungry:
    de: "Das Tier hat Hunger."
    en: "The animal is hungry."
    draft: true
  animal_not_yet:
    de: "Morgen, ja? Heute nicht."
    en: "Tomorrow, yes? Not today."
    draft: true
  animal_already_collected:
    de: "Heute schon. Morgen wieder."
    en: "Already today. Tomorrow again."
    draft: true
  missing_ingredients:
    de: "Das reicht noch nicht."
    en: "That's not enough yet."
    draft: true
  not_a_field:
    de: "Hier ist kein Feld."
    en: "There's no field here."
    draft: true
  no_seed:
    de: "Du hast keinen Samen."
    en: "You have no seed."
    draft: true
  already_planted:
    de: "Hier wächst schon etwas."
    en: "Something is already growing here."
    draft: true
  nothing_planted:
    de: "Hier wächst nichts."
    en: "Nothing is growing here."
    draft: true
  already_watered:
    de: "Schon gegossen."
    en: "Already watered."
    draft: true
  not_ripe:
    de: "Das ist noch nicht reif."
    en: "That isn't ripe yet."
    draft: true
  no_water:
    de: "Du brauchst Wasser."
    en: "You need water."
    draft: true
  rained_overnight:
    de: "Es hat geregnet."
    en: "It rained."
    draft: true
