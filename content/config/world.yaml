# World layout — GDD Part 14 §2 (the split map).
#
#   [PLAYER FARM] ──path──> [VILLAGE] ──> [FOREST] ──> [LAKE]
#                               └──> [HILLS]
#
# Farm  = private space: labour, quiet, no NPCs except Anna next door.
# Village = social space: all shops, all people, all talk.
#
# The geography teaches the rhythm — work at home, speak in town — and makes
# going to town a choice with a reason rather than ambient social noise.
#
# `locations` maps every name an NPC schedule can reference to the map it is
# on. The engine reads this, so moving a shop between maps is a content edit.

config_id: world

maps:
  farm:
    scene: "res://scenes/world/farm.tscn"
    display: Hof
  village:
    scene: "res://scenes/world/village.tscn"
    display: Dorf
  interior_farmhouse:
    scene: "res://scenes/world/interiors/farmhouse.tscn"
    display: Zuhause
  interior_bakery:
    scene: "res://scenes/world/interiors/bakery.tscn"
    display: Bäckerei
  interior_shop:
    scene: "res://scenes/world/interiors/shop.tscn"
    display: Laden

locations:
  farm_yard: farm
  field: farm
  farmhouse: farm
  stream: farm
  village_square: village
  bakery: village
  shop: village
  rathaus: village
  lane: village

# Where the player arrives when entering a map from another one.
arrivals:
  farm: from_village
  village: from_farm

# Part 14 §3 MVP enterable policy: the player's own farmhouse and the
# commercial ground floors. Every other home is a blackout interior until
# 3 hearts (pre-wired, reachable once affection lands in Week 7).
enterable:
  interior_farmhouse: open
  interior_bakery: open
  interior_shop: open
