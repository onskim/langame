# Scheduler and gate thresholds — GDD Part 10 §4.
# Tuned against tools/simulate.py; do not change one without re-running it.

config_id: thresholds

scheduler:
  wantlist_size: 12        # top N due words considered each day
  new_words_per_day: 5     # N new words (early campaign)
  new_words_blocked_at: 8  # no new words if this many are already due
  review_target_min: 5     # acceptance band, Part 10 §6 Week 4
  review_target_max: 15

sm2:
  initial_ease: 2.5
  min_ease: 1.3
  ease_bonus: 0.10         # on pass
  ease_penalty: 0.20       # on fail
  first_interval_days: 1.0
  second_interval_days: 3.0

# A word not seen for this many days is "starved" — the acceptance test fails
# if any introduced word starves over a 30-day run.
starvation_days: 12

drill:
  pron_fails_to_flag: 2    # Addendum §2
  passes_to_clear: 2
  max_cycles: 3

pronunciation:
  a1_pass_accuracy: 60     # Azure PA HundredMark, Part 10 §4
  tighten_per_act: 5
