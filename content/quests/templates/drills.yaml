# Drill quests — Addendum v0.2 §2, worked example in GDD Part 9 §3.
#
# A drill is spawned when a word fails pronunciation twice in a row. It is a
# quest, not a popup: the player greets villagers, and the flagged word rides
# along inside real social contact. That is the whole design — remediation that
# looks like the game rather than like a test.

- quest_id: q06_morgengruss
  kind: drill
  giver: npc_mila
  rep_gate: 0
  prereq: []
  vocab_tags: [chunk_guten_morgen]
  slots:
    PHRASE: {pos: phrase}
  steps:
    - line: mila_q06_ask
      objective: {action: greet, target: "{PHRASE}", count: 3}
  rewards:
    rep: {npc_mila: 2}
    money: 1
