# Bindable side-quest templates — GDD Part 10 §5.3.
#
# A template is a shape with holes. The scheduler fills them from the day's
# wantlist (tools/simulate.py proves the load stays sane), so a side quest is
# always ABOUT a word that is fading. Templates reinforce; they never introduce
# — the binder enforces seen>=3 before a word may be bound.
#
# `de` templates carry {SLOT} markers filled at bind time. They are still
# draft German and still gated on native review (Part 5 §4).

- quest_id: tpl_feed_animal
  kind: template
  giver: npc_anna
  rep_gate: 0
  prereq: [q02]
  vocab_tags: []
  slots:
    ANIMAL: {pos: noun, family: farm}
  steps:
    - line: tpl_feed_animal_ask
      objective: {action: feed, target: "{ANIMAL}"}
  rewards:
    rep: {npc_anna: 1}
    money: 2

- quest_id: tpl_fetch_item
  kind: template
  giver: npc_petra
  rep_gate: 0
  prereq: [q02]
  vocab_tags: []
  slots:
    ITEM: {pos: noun}
  steps:
    - line: tpl_fetch_item_ask
      objective: {action: fetch, target: "{ITEM}", count: 2}
  rewards:
    rep: {npc_petra: 1}
    money: 2

- quest_id: tpl_water_thing
  kind: template
  giver: npc_anna
  rep_gate: 0
  prereq: [q03]
  vocab_tags: []
  slots:
    TARGET: {pos: noun, family: farm}
  steps:
    - line: tpl_water_thing_ask
      objective: {action: water, target: "{TARGET}", count: 2}
  rewards:
    rep: {npc_anna: 1}
    money: 2
