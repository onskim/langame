# Anna — farmer, the player's first NPC. GDD Part 13 §cast.
# Voice brief drives ElevenLabs rendering (Part 12 audio revision).

npc_id: npc_anna
name: Anna
role: farmer
voice_preset: anna_warm_mid
home: anna_farmhouse
rep_gate: 0
wants: help_on_the_farm
# Anna is the ONE NPC on the farm map (Part 14 §2 mentor exception). She works
# her OWN adjacent plot — her farmhouse, her barn, her field — not the player's.
# She steps onto the player's yard mid-morning because that is when she teaches;
# the rest of her day is her own work, which is what makes her a neighbour
# rather than a quest dispenser standing in your kitchen.
schedule:
  - {from: "06:00", to: "09:00", at: anna_field}
  - {from: "09:00", to: "12:00", at: farm_yard}
  - {from: "12:00", to: "17:00", at: anna_yard}
  - {from: "17:00", to: "19:00", at: village_square}
  - {from: "19:00", to: "24:00", at: anna_farmhouse}
shop: null

# Memory callbacks — GDD Part 15 §3.7 schema, §3.8 signature flavour.
# Anna holds the whole farm-domain word history and the tutorial arc, so she
# gets prime retest position: she is the first person the player sees each day.
#
# `{word}` slots bind from the fact's ref_id at selection time, so ONE authored
# template covers a whole family — the side-quest template economics applied to
# memory (§3.7). All German LLM-drafted, `draft: true` (Part 5 §4 gate).
callbacks:
  - cb_id: cb_anna_retest_farm
    context: greeting
    fact_kind: word_struggle
    draft: true
    de: "Guten Morgen! Na — was ist das?"
    en: "Good morning! Well — what is that?"
    focus_words: ["{word}"]
    gestures: [{word: "{word}", point_at: "{word_object}"}]

  - cb_id: cb_anna_triumph_farm
    context: greeting
    fact_kind: word_triumph
    draft: true
    de: "Du kannst es jetzt. Ich habe es gehört!"
    en: "You can say it now. I heard you!"
    focus_words: ["{word}"]
    reward: {affection: 2, once_per_ref: true}

  - cb_id: cb_anna_quest_memory
    context: greeting
    fact_kind: quest_memory
    draft: true
    de: "Weißt du noch? Dein erster Tag hier."
    en: "Do you remember? Your first day here."
    focus_words: [chunk_guten_morgen]

  - cb_id: cb_anna_first_meeting
    context: greeting
    fact_kind: first_meeting
    draft: true
    de: "Da bist du ja wieder."
    en: "There you are again."
    focus_words: []

  - cb_id: cb_anna_coached
    context: greeting
    fact_kind: drill_coached
    draft: true
    de: "Sag es noch einmal für mich. Bitte."
    en: "Say it once more for me. Please."
    focus_words: ["{word}"]
