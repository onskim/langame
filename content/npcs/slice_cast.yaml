# The four ★ slice NPCs beyond Anna — GDD Part 13 cast, Part 10 §5.3 quest table.
# Anna has her own file because she carries the most content.
#
# Schedules are (from, to, at) windows across the 06:00–24:00 day (Part 12 §time).
# `at` names a location marker placed in the world scene; the engine resolves the
# name, so a content author can re-route an NPC without touching a scene file.

- npc_id: npc_karl
  name: Karl
  role: baker
  voice_preset: karl_gruff_low
  home: bakery
  rep_gate: 0
  wants: bread_delivered
  schedule:
    - {from: "06:00", to: "13:00", at: bakery}
    - {from: "13:00", to: "17:00", at: village_square}
    - {from: "17:00", to: "24:00", at: bakery}
  shop: {sells: [brot]}

- npc_id: npc_petra
  name: Petra
  role: shopkeeper
  voice_preset: petra_bright_mid
  home: shop
  rep_gate: 0
  wants: prices_learned
  schedule:
    - {from: "06:00", to: "09:00", at: shop}
    - {from: "09:00", to: "18:00", at: village_square}
    - {from: "18:00", to: "24:00", at: shop}
  shop: {sells: [heu, brot]}

- npc_id: npc_weber
  name: Weber
  role: mayor
  voice_preset: weber_formal_low
  home: village_square
  rep_gate: 0
  wants: village_festival
  schedule:
    - {from: "06:00", to: "11:00", at: village_square}
    - {from: "11:00", to: "16:00", at: bakery}
    - {from: "16:00", to: "24:00", at: village_square}
  shop: null

- npc_id: npc_mila
  name: Mila
  role: child
  voice_preset: mila_child_high
  home: village_square
  rep_gate: 0
  wants: someone_to_play_with
  # Mila is the difficulty valve (Part 3 §2): she re-explains in simpler German,
  # so she must be easy to find — she roams rather than sitting in one building.
  schedule:
    - {from: "06:00", to: "10:00", at: farm_yard}
    - {from: "10:00", to: "14:00", at: stream}
    - {from: "14:00", to: "19:00", at: village_square}
    - {from: "19:00", to: "24:00", at: farm_yard}
  shop: null
