# The eleven remaining villagers — GDD Part 13 §§6–16, buildings per Part 14 §3.
#
# Profiles, schedules, vocabulary domains and memory callbacks, authored from
# the compendium rather than invented. Each carries the fields the engine reads
# (schedule, home, voice_preset) plus the two Part 13 fields that make them
# authorable later: `domain` names the vocabulary family they own, and `chain`
# lists their quest arc so nobody has to re-derive it from prose.
#
# WHAT IS DELIBERATELY NOT HERE, so it is not mistaken for finished:
#   * their ~200 domain words and their 4–6 quests each. Part 8's vertical-slice
#     gate says validate with the ★ five before ramping content, and authoring
#     200 words against a schema Part 15 has only just changed is exactly the
#     expensive mistake that gate exists to prevent.
#   * their buildings. Part 14 §3 places each one, but the founder is
#     redesigning the village, and a building placed now is a building moved
#     twice.
#
# Every NPC below is reachable, scheduled, remembers you and can be spoken to.
# All German is LLM-drafted, `draft: true` (Part 5 §4 gate).

# --- 6. Oma Hilde — the second difficulty valve (Part 13 §6) -----------------
# Slowest, kindest speech in the village: the recovery zone after a hard day.
- npc_id: npc_hilde
  name: Oma Hilde
  role: grandmother
  voice_preset: hilde_soft_slow
  home: hilde_cottage
  rep_gate: 0
  wants: recipes_passed_on
  domain: home_family
  chain: [qh1_suppe, qh2_familienfoto, qh3_geheimkuchen, qh4_winteressen]
  schedule:
    - {from: "06:00", to: "11:00", at: hilde_garden}
    - {from: "11:00", to: "17:00", at: hilde_cottage}
    - {from: "17:00", to: "20:00", at: village_square}
    - {from: "20:00", to: "24:00", at: hilde_cottage}
  callbacks:
    - cb_id: cb_hilde_usual
      context: greeting
      fact_kind: usual_order
      draft: true
      de: "Wieder Suppe?"
      en: "Soup again?"
      focus_words: []
    - cb_id: cb_hilde_triumph
      context: greeting
      fact_kind: word_triumph
      draft: true
      de: "Hör mal an. So schön sagst du das."
      en: "Listen to you. You say it so nicely."
      focus_words: ["{word}"]
      reward: {affection: 2, once_per_ref: true}
    - cb_id: cb_hilde_first_meeting
      context: greeting
      fact_kind: first_meeting
      draft: true
      de: "Komm, setz dich. Hast du Hunger?"
      en: "Come, sit down. Are you hungry?"
      focus_words: []

