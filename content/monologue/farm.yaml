# The player character's inner monologue — GDD Part 15 §2.
#
# The ONLY English voice in the game, and the one that must disappear. Each line
# is authored once in English with {span} markers; the spans swap to German
# independently, driven by the player's own mastery. The player never chooses
# this and is never told it is happening — they simply notice, one day, that
# they thought "die Kuh".
#
# AUTHORING LAWS (Part 15 §2.1), all lint-enforced:
#   * `en_template` contains NO German. `de` spans contain no English.
#   * Nouns bring their articles — "die Kuh", never "Kuh".
#   * Chunks swap WHOLE ("Guten Morgen"), never word by word.
#   * Every span word must be a real word_id the player can meet in a quest.
#     The monologue NEVER introduces vocabulary.
#   * `de_full` is the M3 thought: the same idea, entirely in German.
#
# All German here is LLM-drafted and carries `draft: true` (Part 5 §4 gate).

- mono_id: mono_wake_01
  class: wake
  draft: true
  en_template: "Another morning. {c1} will be hungry."
  spans:
    c1: {de: "Die Kuh", en: "The cow", words: [kuh]}
  de_full: "Wieder Morgen. Die Kuh hat Hunger."
  focus_words: [kuh]
  family: farm

